<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><defs><clipPath id="peek"><rect x="24" y="558" width="354" height="92" rx="24"/></clipPath></defs><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">2 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Segui la curiosità</tspan></text><text x="24" y="195" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Per Te mescola le scoperte. Le</tspan><tspan x="24" dy="25">categorie ti aiutano a esplorare</tspan><tspan x="24" dy="25">un argomento.</tspan></text><rect x="24" y="290" width="110" height="48" rx="24" fill="#82513e"/><text x="42" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="42" dy="0">Per Te</tspan></text><rect x="142" y="290" width="108" height="48" rx="24" fill="#35302c"/><text x="160" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="160" dy="0">Scienza</tspan></text><rect x="260" y="290" width="108" height="48" rx="24" fill="#35302c"/><text x="278" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="278" dy="0">Arte</tspan></text><rect x="24" y="364" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="400" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Scienza</tspan></text><text x="44" y="447" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Aurora polare</tspan></text><text x="44" y="486" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Categorie nuove possono comparire</tspan><tspan x="44" dy="25">con i tuoi interessi e i contenuti</tspan><tspan x="44" dy="25">disponibili.</tspan></text><text x="24" y="642" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">La scelta di un interesse non garantisce</tspan><tspan x="24" dy="25">articoli già disponibili.</tspan></text><text x="24" y="715" fill="#df9878" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Scegli una categoria per provare.</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></svg>