<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><defs><clipPath id="peek"><rect x="24" y="558" width="354" height="92" rx="24"/></clipPath></defs><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">3 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Il feed impara</tspan><tspan x="24" dy="43">da te</tspan></text><text x="24" y="238" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Le aperture contano poco, i</tspan><tspan x="24" dy="25">salvataggi di più. Puoi rimuovere</tspan><tspan x="24" dy="25">un salvataggio quando vuoi.</tspan></text><rect x="24" y="330" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="366" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Arte</tspan></text><text x="44" y="413" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Origami</tspan></text><text x="44" y="452" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Una piega dopo l’altra, un foglio</tspan><tspan x="44" dy="25">diventa una forma.</tspan></text><rect x="44" y="494" width="130" height="42" rx="21" fill="#82513e"/><text x="70" y="521" fill="#efe9df" font-size="16" font-family="Source Sans 3"><tspan x="70" dy="0">Apri esempio</tspan></text><rect x="188" y="494" width="166" height="42" rx="21" fill="#82513e"/><text x="217" y="521" fill="#efe9df" font-size="16" font-family="Source Sans 3"><tspan x="217" dy="0">Salva esempio</tspan></text><text x="24" y="612" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Le preferenze restano sul telefono.</tspan><tspan x="24" dy="25">Wikipedia e Gemini, se attivo,</tspan><tspan x="24" dy="25">possono usare la connessione.</tspan></text><text x="24" y="713" fill="#df9878" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">L’esempio non cambia il tuo profilo.</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></svg>