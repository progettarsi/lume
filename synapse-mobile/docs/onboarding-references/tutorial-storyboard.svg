<svg xmlns="http://www.w3.org/2000/svg" width="1668" height="874" viewBox="0 0 1668 874"><defs><clipPath id="peek"><rect x="24" y="558" width="354" height="92" rx="24"/></clipPath></defs><g transform="translate(0 0)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">1 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Una scoperta</tspan><tspan x="24" dy="43">alla volta</tspan></text><text x="24" y="238" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Scorri verso l’alto per passare al</tspan><tspan x="24" dy="25">prossimo articolo. Tocca il titolo</tspan><tspan x="24" dy="25">per approfondire.</tspan></text><rect x="24" y="322" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="358" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Scienza</tspan></text><text x="44" y="405" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Aurora polare</tspan></text><text x="44" y="444" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Il cielo si illumina quando le</tspan><tspan x="44" dy="25">particelle solari incontrano</tspan><tspan x="44" dy="25">l’atmosfera.</tspan></text><g clip-path="url(#peek)"><rect x="24" y="558" width="354" height="92" rx="24" fill="#35302c"/><text x="44" y="594" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Arte</tspan></text><text x="44" y="641" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Origami</tspan></text><text x="44" y="680" fill="#efe9df" font-size="17" font-family="Source Sans 3"></text></g><text x="170" y="608" fill="#df9878" font-size="22" font-family="Source Sans 3"><tspan x="170" dy="0">↑</tspan></text><text x="24" y="670" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Puoi provare qui, oppure continuare.</tspan></text><text x="24" y="718" fill="#df9878" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Prova un’altra scheda</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></g><g transform="translate(422 0)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">2 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Segui la curiosità</tspan></text><text x="24" y="195" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Per Te mescola le scoperte. Le</tspan><tspan x="24" dy="25">categorie ti aiutano a esplorare</tspan><tspan x="24" dy="25">un argomento.</tspan></text><rect x="24" y="290" width="110" height="48" rx="24" fill="#82513e"/><text x="42" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="42" dy="0">Per Te</tspan></text><rect x="142" y="290" width="108" height="48" rx="24" fill="#35302c"/><text x="160" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="160" dy="0">Scienza</tspan></text><rect x="260" y="290" width="108" height="48" rx="24" fill="#35302c"/><text x="278" y="321" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="278" dy="0">Arte</tspan></text><rect x="24" y="364" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="400" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Scienza</tspan></text><text x="44" y="447" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Aurora polare</tspan></text><text x="44" y="486" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Categorie nuove possono comparire</tspan><tspan x="44" dy="25">con i tuoi interessi e i contenuti</tspan><tspan x="44" dy="25">disponibili.</tspan></text><text x="24" y="642" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">La scelta di un interesse non garantisce</tspan><tspan x="24" dy="25">articoli già disponibili.</tspan></text><text x="24" y="715" fill="#df9878" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Scegli una categoria per provare.</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></g><g transform="translate(844 0)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">3 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Il feed impara</tspan><tspan x="24" dy="43">da te</tspan></text><text x="24" y="238" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Le aperture contano poco, i</tspan><tspan x="24" dy="25">salvataggi di più. Puoi rimuovere</tspan><tspan x="24" dy="25">un salvataggio quando vuoi.</tspan></text><rect x="24" y="330" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="366" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Arte</tspan></text><text x="44" y="413" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Origami</tspan></text><text x="44" y="452" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Una piega dopo l’altra, un foglio</tspan><tspan x="44" dy="25">diventa una forma.</tspan></text><rect x="44" y="494" width="130" height="42" rx="21" fill="#82513e"/><text x="70" y="521" fill="#efe9df" font-size="16" font-family="Source Sans 3"><tspan x="70" dy="0">Apri esempio</tspan></text><rect x="188" y="494" width="166" height="42" rx="21" fill="#82513e"/><text x="217" y="521" fill="#efe9df" font-size="16" font-family="Source Sans 3"><tspan x="217" dy="0">Salva esempio</tspan></text><text x="24" y="612" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Le preferenze restano sul telefono.</tspan><tspan x="24" dy="25">Wikipedia e Gemini, se attivo,</tspan><tspan x="24" dy="25">possono usare la connessione.</tspan></text><text x="24" y="713" fill="#df9878" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">L’esempio non cambia il tuo profilo.</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></g><g transform="translate(1266 0)"><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">4 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Ritrova le tue</tspan><tspan x="24" dy="43">scoperte</tspan></text><text x="24" y="238" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Home per il feed, Profilo per salvati,</tspan><tspan x="24" dy="25">cronologia e impostazioni. Cerca</tspan><tspan x="24" dy="25">per esplorare Wikipedia.</tspan></text><rect x="24" y="330" width="354" height="226" rx="24" fill="#35302c"/><text x="44" y="373" fill="#efe9df" font-size="23" font-family="Newsreader"><tspan x="44" dy="0">Scegli una destinazione</tspan></text><text x="44" y="417" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Home → scoperte</tspan><tspan x="44" dy="25">Profilo → salvati e impostazioni</tspan><tspan x="44" dy="25">Cerca → ricerca e shuffle</tspan></text><rect x="28" y="590" width="264" height="64" rx="32" fill="#35302c"/><rect x="34" y="596" width="132" height="52" rx="26" fill="#82513e"/><text x="60" y="630" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="60" dy="0">⌂  Home</tspan></text><text x="197" y="630" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="197" dy="0">Profilo</tspan></text><rect x="306" y="594" width="56" height="56" rx="28" fill="#82513e"/><circle cx="332" cy="619" r="8" fill="none" stroke="#efe9df" stroke-width="2"/><path d="M338 625L344 631" stroke="#efe9df" stroke-width="2"/><text x="318" y="630" fill="#efe9df" font-size="27" font-family="Source Sans 3"><tspan x="318" dy="0"></tspan></text><text x="24" y="704" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Due tocchi rapidi su Home</tspan><tspan x="24" dy="25">aggiornano le scoperte.</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></g></svg>