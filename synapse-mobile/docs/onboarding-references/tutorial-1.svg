<svg xmlns="http://www.w3.org/2000/svg" width="402" height="874" viewBox="0 0 402 874"><defs><clipPath id="peek"><rect x="24" y="558" width="354" height="92" rx="24"/></clipPath></defs><rect x="0" y="0" width="402" height="874" rx="0" fill="#1d1b19"/><text x="24" y="60" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="24" dy="0">1 di 4 · Dimostrazione</tspan></text><text x="24" y="125" fill="#efe9df" font-size="36" font-family="Newsreader"><tspan x="24" dy="0">Una scoperta</tspan><tspan x="24" dy="43">alla volta</tspan></text><text x="24" y="238" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Scorri verso l’alto per passare al</tspan><tspan x="24" dy="25">prossimo articolo. Tocca il titolo</tspan><tspan x="24" dy="25">per approfondire.</tspan></text><rect x="24" y="322" width="354" height="218" rx="24" fill="#35302c"/><text x="44" y="358" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Scienza</tspan></text><text x="44" y="405" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Aurora polare</tspan></text><text x="44" y="444" fill="#efe9df" font-size="17" font-family="Source Sans 3"><tspan x="44" dy="0">Il cielo si illumina quando le</tspan><tspan x="44" dy="25">particelle solari incontrano</tspan><tspan x="44" dy="25">l’atmosfera.</tspan></text><g clip-path="url(#peek)"><rect x="24" y="558" width="354" height="92" rx="24" fill="#35302c"/><text x="44" y="594" fill="#b6aea2" font-size="14" font-family="Source Sans 3"><tspan x="44" dy="0">Arte</tspan></text><text x="44" y="641" fill="#efe9df" font-size="29" font-family="Newsreader"><tspan x="44" dy="0">Origami</tspan></text><text x="44" y="680" fill="#efe9df" font-size="17" font-family="Source Sans 3"></text></g><text x="170" y="608" fill="#df9878" font-size="22" font-family="Source Sans 3"><tspan x="170" dy="0">↑</tspan></text><text x="24" y="670" fill="#b6aea2" font-size="16" font-family="Source Sans 3"><tspan x="24" dy="0">Puoi provare qui, oppure continuare.</tspan></text><text x="24" y="718" fill="#df9878" font-size="17" font-family="Source Sans 3"><tspan x="24" dy="0">Prova un’altra scheda</tspan></text><rect x="24" y="768" width="56" height="56" rx="28" fill="#35302c"/><text x="42" y="803" fill="#efe9df" font-size="24" font-family="Source Sans 3"><tspan x="42" dy="0">←</tspan></text><rect x="94" y="768" width="152" height="56" rx="28" fill="#82513e"/><text x="134" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="134" dy="0">Continua</tspan></text><rect x="258" y="768" width="120" height="56" rx="28" fill="#35302c"/><text x="299" y="802" fill="#efe9df" font-size="18" font-family="Source Sans 3"><tspan x="299" dy="0">Salta</tspan></text></svg>